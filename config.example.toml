# Polyglot configuration. API keys are stored in the OS keyring, not here.

[audio]
source = "auto"
ring_seconds = 30.0
gap_fill = true
user_mic = false      # also listen to my microphone (headphones recommended)
# user_device = ""    # input device name or index for the microphone; default input if unset

[vad]
engine = "silero"
start_threshold = 0.5
end_threshold = 0.35
start_frames = 3
end_silence_ms = 600
pre_roll_ms = 300
max_utterance_s = 15.0
min_utterance_ms = 300
partial_interval_ms = 0

[asr]
engine = "whisper"     # whisper | parakeet | qwen3 (parakeet/qwen3: uv sync --extra <name>)
device = "auto"        # auto | cpu | cuda (auto: a GPU the engine can use, else the CPU)
# Whisper
model = "base"         # tiny | base | small | medium | large-v3 | large-v3-turbo
compute_type = "auto"  # auto | int8 | float16 | float32 | ... (auto: int8 on CPU, float16 on GPU)
beam_size = 5
# Parakeet v3: 25 European languages, fast on a CPU (ONNX Runtime)
parakeet_model = "nemo-parakeet-tdt-0.6b-v3"
parakeet_quantization = "int8"  # int8 | none
# Qwen3-ASR: 30 languages (PyTorch). 0.6B suits a CPU; 1.7B is more accurate but wants a GPU.
qwen3_model = "Qwen/Qwen3-ASR-0.6B"
lock_after = 2
lock_min_probability = 0.8
queue_size = 8

[translation]
enabled = false
provider = "openai"
target_language = "en"
model = "gpt-6-luna"  # any OpenAI chat model ID; Settings lists the ones your key can use
timeout_s = 3.0

[suggestions]
enabled = false
model = "gpt-6-luna"  # gpt-4o-mini and gpt-4.1-mini retire 2027-01-14 (replacement: gpt-6-luna)
timeout_s = 6.0
conversation_type = "meeting"
history = 6          # most utterances of earlier conversation to include
history_after = 4    # most utterances said after the sentence being answered (reply hotkeys)
history_chars = 3000 # soft cap on the context's total length (the nearest is always kept)
options = 2

# What suggestions may say about you. Saved once, used every time. Sent to the AI provider with each
# suggestion request: public, shareable details only (no health, politics, religion, money).
# List fields hold up to 15 items of 120 characters; summary up to 500.
[profile]
name = ""
role = ""
location = ""
summary = ""
goals = ""           # what you want from the conversation, e.g. "get this job"
tone = ""            # e.g. "polite, concise"
languages = []       # e.g. ["English (native)", "Spanish (beginner)"]
skills = []
experience = []
education = []
hobbies = []
interests = []
talking_points = []  # other facts you are happy to mention

[ui]
opacity = 0.92
x = 100
y = 100
width = 420
height = 640
hide_from_capture = true
hotkey_suggest = "<ctrl>+<alt>+s"
hotkey_toggle = "<ctrl>+<alt>+h"
hotkey_lock = "<ctrl>+<alt>+l"   # lock/unlock following the latest sentence
reply_hotkeys = 4                  # their latest N sentences (1-10) get modifiers + 1, 2, ... 0
reply_hotkey_modifiers = "<ctrl>+<alt>"   # empty turns the numbered reply hotkeys off

[privacy]
log_content = false
dump_audio = false
