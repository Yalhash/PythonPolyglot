# Polyglot configuration. API keys are stored in the OS keyring, not here.

[audio]
source = "auto"
ring_seconds = 30.0
gap_fill = true

[vad]
engine = "silero"
start_threshold = 0.5
end_threshold = 0.35
start_frames = 3
end_silence_ms = 600
pre_roll_ms = 300
max_utterance_s = 15.0
min_utterance_ms = 300
partial_interval_ms = 0

[asr]
model = "base"
device = "auto"
compute_type = "default"
beam_size = 5
lock_after = 2
lock_min_probability = 0.8
queue_size = 8

[translation]
enabled = false
provider = "openai"
target_language = "en"
model = "gpt-4o-mini"
timeout_s = 3.0

[suggestions]
enabled = false
model = "gpt-4.1-mini"
timeout_s = 6.0
conversation_type = "meeting"
history = 6
options = 2

[ui]
opacity = 0.92
x = 100
y = 100
width = 420
height = 640
hide_from_capture = true
hotkey_suggest = "<ctrl>+<alt>+s"
hotkey_toggle = "<ctrl>+<alt>+h"

[privacy]
log_content = false
dump_audio = false
