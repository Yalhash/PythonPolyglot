# Polyglot configuration. API keys are stored in the OS keyring, not here.

[audio]
source = "auto"
ring_seconds = 30.0
gap_fill = true
user_mic = false      # also listen to my microphone (headphones recommended)
# user_device = ""    # input device name or index for the microphone; default input if unset

[vad]
engine = "silero"
start_threshold = 0.5
end_threshold = 0.35
start_frames = 3
end_silence_ms = 600
pre_roll_ms = 300
max_utterance_s = 15.0
min_utterance_ms = 300
partial_interval_ms = 0

[asr]
model = "base"
device = "auto"
compute_type = "auto"  # auto | int8 | float16 | float32 | ... (auto: int8 on CPU, float16 on GPU)
beam_size = 5
lock_after = 2
lock_min_probability = 0.8
queue_size = 8

[translation]
enabled = false
provider = "openai"
target_language = "en"
model = "gpt-4o-mini"  # any OpenAI chat model ID; Settings lists the ones your key can use
timeout_s = 3.0

[suggestions]
enabled = false
model = "gpt-4.1-mini"  # gpt-4o-mini and gpt-4.1-mini retire 2027-01-14 (replacement: gpt-6-luna)
timeout_s = 6.0
conversation_type = "meeting"
history = 6          # most utterances of earlier conversation to include
history_chars = 3000 # soft cap on their total length (the newest is always kept)
options = 2

# What suggestions may say about you. Saved once, used every time. Sent to the AI provider with each
# suggestion request: public, shareable details only (no health, politics, religion, money).
# List fields hold up to 15 items of 120 characters; summary up to 500.
[profile]
name = ""
role = ""
location = ""
summary = ""
goals = ""           # what you want from the conversation, e.g. "get this job"
tone = ""            # e.g. "polite, concise"
languages = []       # e.g. ["English (native)", "Spanish (beginner)"]
skills = []
experience = []
education = []
hobbies = []
interests = []
talking_points = []  # other facts you are happy to mention

[ui]
opacity = 0.92
x = 100
y = 100
width = 420
height = 640
hide_from_capture = true
hotkey_suggest = "<ctrl>+<alt>+s"
hotkey_toggle = "<ctrl>+<alt>+h"

[privacy]
log_content = false
dump_audio = false
