name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keeps uv.lock in sync with pyproject.toml. On feature branches it also applies
  # ruff's safe autofixes and formatting, and commits them; on main it only checks.
  housekeeping:
    name: Lockfile and formatting
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
      - uses: astral-sh/setup-uv@v6
      - name: Resolve dependencies
        run: uv lock
      - name: Autofix (feature branches only)
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          uvx ruff@0.14.0 check --fix --exit-zero .
          uvx ruff@0.14.0 format .
      - name: Commit changes
        id: commit
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            if [ "${{ github.event_name }}" != "push" ]; then
              git status --porcelain
              echo "::error title=Out of date::uv.lock or formatting is out of date; run 'uv lock' and 'ruff format'"
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(ci): update uv.lock and apply ruff fixes"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python }})
    needs: housekeeping
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      # Native windows on Windows so the real capture-shield API is exercised.
      QT_QPA_PLATFORM: ${{ matrix.os == 'windows-latest' && 'windows' || 'offscreen' }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.housekeeping.outputs.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 \
            libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libportaudio2
      - name: Install (locked)
        id: install
        run: uv sync --locked
      - name: Lint
        shell: bash
        run: uv run ruff check --output-format=concise . | uv run python scripts/ci_annotate.py lines ruff
      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: uv run mypy | uv run python scripts/ci_annotate.py lines mypy
      - name: Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: uv run pytest -q --junitxml=junit.xml --cov=polyglot --cov-report=term-missing:skip-covered
      - name: Annotate test failures
        if: failure()
        shell: bash
        run: test -f junit.xml && uv run python scripts/ci_annotate.py junit junit.xml || true
      - name: Diagnose a crashed test run
        if: failure() && hashFiles('junit.xml') == ''
        shell: bash
        run: |
          uv run pytest -v -p no:cacheprovider -o addopts="" -m "not slow" 2>&1 \
            | uv run python scripts/ci_annotate.py tail "crashed test run (last lines)" || true

  models:
    name: Real models (Whisper tiny, Silero)
    needs: housekeeping
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.housekeeping.outputs.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends espeak-ng libportaudio2 libegl1 \
            libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-whisper-tiny
      - run: uv sync --locked
      - name: Slow tests
        shell: bash
        run: uv run pytest -m slow -q --junitxml=junit.xml
      - name: Annotate test failures
        if: failure()
        shell: bash
        run: test -f junit.xml && uv run python scripts/ci_annotate.py junit junit.xml || true
